name: CI

on:
  push:
    branches: [main, solutions]
  pull_request:
    branches: [main, solutions]

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --nologo -warnaserror

  # On main every test fails by design (they are exercises), so tests only run on the solutions branch.
  test-solutions:
    name: Verify reference solutions
    if: github.ref_name == 'solutions' || github.base_ref == 'solutions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --nologo

  # On main, make sure the generator left no solutions behind and every test fails with NotImplementedException.
  verify-placeholders:
    name: Verify main has only TODOs
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: No solution markers may remain
        run: |
          if grep -rn --include='*Exercises.cs' '//!' LinqGym; then
            echo 'Solution markers found on main - run tools/Make-StudentVersion.ps1'; exit 1
          fi
      # Guards against answers reaching main: a solved exercise passes, and passed
      # must be zero. Counting NotImplementedException alone is too weak, because
      # each failure logs it about twice, so the count stays above the test total
      # even when many exercises have been solved.
      - name: Every exercise must be an unsolved TODO
        run: |
          dotnet test --nologo --logger 'trx;LogFileName=results.trx' || true
          trx=$(find . -name results.trx | head -1)
          if [ -z "$trx" ]; then echo 'No trx file was produced.'; exit 1; fi
          counters=$(grep -oE '<Counters[^/]*/>' "$trx" | head -1)
          field() { echo "$counters" | grep -oE " $1=\"[0-9]+\"" | grep -oE '[0-9]+'; }
          total=$(field total); passed=$(field passed); failed=$(field failed)
          nie=$(grep -c 'NotImplementedException' "$trx" || true)
          echo "total=$total passed=$passed failed=$failed notImplemented=$nie"
          if [ "$total" -eq 0 ]; then echo 'No tests ran.'; exit 1; fi
          if [ "$passed" -ne 0 ]; then
            echo "$passed exercise(s) are solved on main. Answers belong on solutions; regenerate main."
            exit 1
          fi
          if [ "$failed" -ne "$total" ]; then echo 'Some tests did not run.'; exit 1; fi
          if [ "$nie" -lt "$total" ]; then echo 'Some tests failed for a reason other than the TODO placeholder.'; exit 1; fi
